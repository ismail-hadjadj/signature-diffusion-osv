[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signature-diffusion-osv"
version = "1.0.0"
description = "Neuromotor Kinematic and Latent Diffusion Framework for Offline Signature Verification"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Anonymous Authors"}
]
keywords = [
    "biometrics",
    "signature-verification",
    "neuromotor-kinematics",
    "diffusion-models",
    "vision-transformer",
    "contrastive-learning"
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "diffusers>=0.25.0",
    "transformers>=4.35.0",
    "timm>=0.9.12",
    "opencv-python>=4.8.0",
    "scikit-image>=0.20.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0"
]
